<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel ESP – SENAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --azul:#004A93;--azul-esc:#00305F;--bg:#EEF2F7;--card:#FFFFFF;--texto:#12233A;--suave:#5B6B80;--linha:#D5DDE8;
  --ok:#1E8E4E;--atencao:#C77700;--critico:#D91E2B;--ok-bg:#E3F4EA;--atencao-bg:#FCEFD6;--critico-bg:#FBE1E3;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0B1626;--card:#13233B;--texto:#E8EEF7;--suave:#9FB0C6;--linha:#243752;
  --ok:#4CCB85;--atencao:#F0A93B;--critico:#FF6B73;--ok-bg:#12372A;--atencao-bg:#3A2D12;--critico-bg:#3F1A1F;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0B1626;--card:#13233B;--texto:#E8EEF7;--suave:#9FB0C6;--linha:#243752;
  --ok:#4CCB85;--atencao:#F0A93B;--critico:#FF6B73;--ok-bg:#12372A;--atencao-bg:#3A2D12;--critico-bg:#3F1A1F;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--texto);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
header{background:var(--azul-esc);color:#fff;border-bottom:6px solid var(--critico)}
.topo{max-width:1100px;margin:0 auto;padding:18px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.marca{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:2.2rem;letter-spacing:.04em;background:#fff;color:var(--azul);padding:0 12px;line-height:1.15;border-radius:2px}
.titulo{flex:1;min-width:200px}
.titulo h1{margin:0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.6rem;font-weight:600}
.titulo p{margin:0;color:#BFD3EA;font-size:.95rem}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modo{display:flex;align-items:center;gap:8px;font-size:.9rem;color:#fff}
.dot{width:10px;height:10px;border-radius:50%;background:#4CCB85}
.dot.pausado{background:#9FB0C6}
button{font:inherit;font-weight:500;cursor:pointer;border:1px solid #fff;background:transparent;color:#fff;padding:7px 14px;border-radius:4px}
button:hover{background:rgba(255,255,255,.14)}
button:focus-visible{outline:3px solid #FFD24D;outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:22px 20px 40px}
.resumo{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:6px;border-left:8px solid var(--ok);background:var(--ok-bg);margin-bottom:20px;font-weight:600}
.resumo.atencao{border-color:var(--atencao);background:var(--atencao-bg)}
.resumo.critico{border-color:var(--critico);background:var(--critico-bg)}
.resumo small{margin-left:auto;font-weight:400;color:var(--suave)}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--linha);border-top:5px solid var(--azul);border-radius:6px;padding:16px 18px 12px}
.card.atencao{border-top-color:var(--atencao)}.card.critico{border-top-color:var(--critico)}
.card h2{margin:0;font-size:1rem;font-weight:600;color:var(--suave);display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-size:.8rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--ok-bg);color:var(--ok)}
.atencao .chip{background:var(--atencao-bg);color:var(--atencao)}
.critico .chip{background:var(--critico-bg);color:var(--critico)}
.valor{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:3.6rem;line-height:1.05;margin:8px 0 0;font-variant-numeric:tabular-nums}
.valor span{font-size:1.4rem;font-weight:600;color:var(--suave);margin-left:6px}
.faixa{font-size:.85rem;color:var(--suave);margin:2px 0 8px}
svg.spark{width:100%;height:56px;display:block}
.spark polyline{fill:none;stroke:var(--azul);stroke-width:2;vector-effect:non-scaling-stroke}
.atencao .spark polyline{stroke:var(--atencao)}.critico .spark polyline{stroke:var(--critico)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .spark polyline{stroke:#6FB1FF}}
:root[data-theme="dark"] .spark polyline{stroke:#6FB1FF}
footer{max-width:1100px;margin:0 auto;padding:0 20px 28px;color:var(--suave);font-size:.85rem}
@media (prefers-reduced-motion:no-preference){.valor{transition:color .3s}}
</style>
</head>
<body>
<header>
  <div class="topo">
    <div class="marca" aria-label="SENAI">SENAI</div>
    <div class="titulo"><h1>Monitoramento do equipamento</h1><p>Leituras do ESP em tempo real</p></div>
    <div class="ctrl">
      <div class="modo"><span class="dot" id="dot"></span><span id="modo">Modo simulação</span></div>
      <button id="btn" type="button">Pausar</button>
    </div>
  </div>
</header>
<main>
  <div class="resumo" id="resumo"><span id="resumoTxt">Tudo dentro do normal</span><small id="hora">–</small></div>
  <section class="grade" id="grade" aria-live="off"></section>
</main>
<footer>Valores aleatórios para teste. Quando o ESP estiver conectado, o painel passa a exibir as leituras reais.</footer>

<script>
// Configuração de cada grandeza: faixa simulada e limites de alerta
const SENSORES = [
  {id:'temperatura',nome:'Temperatura',un:'°C',min:35,max:75,dec:1,atencao:[null,65],critico:[null,80],faixa:'Normal até 65 °C'},
  {id:'vibracao',nome:'Vibração',un:'mm/s',min:0.5,max:6,dec:2,atencao:[null,4.5],critico:[null,7.1],faixa:'Normal até 4,5 mm/s'},
  {id:'tensao',nome:'Tensão',un:'V',min:208,max:232,dec:1,atencao:[209,231],critico:[200,240],faixa:'Normal de 209 a 231 V'},
  {id:'corrente',nome:'Corrente',un:'A',min:4,max:17,dec:2,atencao:[null,15],critico:[null,18],faixa:'Normal até 15 A'}
];
const N = 30;
const hist = {}, ultimo = {};
const grade = document.getElementById('grade');

SENSORES.forEach(s=>{
  hist[s.id] = [];
  grade.insertAdjacentHTML('beforeend',
   `<article class="card" id="c-${s.id}">
      <h2>${s.nome}<span class="chip" id="chip-${s.id}">Normal</span></h2>
      <p class="valor"><b id="v-${s.id}">–</b><span>${s.un}</span></p>
      <p class="faixa">${s.faixa}</p>
      <svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><polyline id="l-${s.id}" points=""/></svg>
    </article>`);
});

function estado(s,v){
  const fora=(lim)=> (lim[0]!==null && v<lim[0]) || (lim[1]!==null && v>lim[1]);
  if(fora(s.critico)) return 'critico';
  if(fora(s.atencao)) return 'atencao';
  return 'ok';
}
const ROT = {ok:'Normal',atencao:'Atenção',critico:'Crítico'};
const fmt = (v,d)=> v.toFixed(d).replace('.',',');

// Ponto de entrada: o ESP (ou qualquer fonte) chama esta função com os valores reais.
// Exemplo: atualizarLeituras({temperatura:42.3, vibracao:1.8, tensao:221.5, corrente:7.4})
function atualizarLeituras(d){
  let pior='ok';
  SENSORES.forEach(s=>{
    const v = d[s.id]; if(typeof v!=='number') return;
    ultimo[s.id]=v;
    const h=hist[s.id]; h.push(v); if(h.length>N) h.shift();
    const e=estado(s,v);
    if(e==='critico' || (e==='atencao' && pior==='ok')) pior=e;
    document.getElementById('v-'+s.id).textContent=fmt(v,s.dec);
    document.getElementById('chip-'+s.id).textContent=ROT[e];
    document.getElementById('c-'+s.id).className='card '+(e==='ok'?'':e);
    const lo=Math.min(...h,s.min), hi=Math.max(...h,s.max);
    document.getElementById('l-'+s.id).setAttribute('points',
      h.map((x,i)=>`${(i/(N-1))*100},${38-((x-lo)/(hi-lo||1))*36}`).join(' '));
  });
  const r=document.getElementById('resumo');
  r.className='resumo '+(pior==='ok'?'':pior);
  document.getElementById('resumoTxt').textContent =
    pior==='ok'?'Tudo dentro do normal':pior==='atencao'?'Atenção: há leituras fora da faixa normal':'Crítico: há leituras em nível de risco';
  document.getElementById('hora').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR');
}

// Simulação com variação suave (passeio aleatório)
function simular(){
  const d={};
  SENSORES.forEach(s=>{
    const base = ultimo[s.id] ?? (s.min+(s.max-s.min)/2);
    const passo=(s.max-s.min)*0.08;
    let v = base + (Math.random()-0.5)*2*passo;
    if(Math.random()<0.04) v = s.min+Math.random()*(s.max-s.min)*1.25; // pico ocasional
    d[s.id]=Math.max(s.min*0.9,Math.min(s.max*1.2,v));
  });
  atualizarLeituras(d);
}

let timer=null;
const btn=document.getElementById('btn');
function iniciar(){simular();timer=setInterval(simular,1500);}
btn.addEventListener('click',()=>{
  const rodando=!!timer;
  if(rodando){clearInterval(timer);timer=null;}else{iniciar();}
  btn.textContent=rodando?'Retomar':'Pausar';
  document.getElementById('modo').textContent=rodando?'Simulação pausada':'Modo simulação';
  document.getElementById('dot').classList.toggle('pausado',rodando);
});
iniciar();
</script>
</body>
</html>
